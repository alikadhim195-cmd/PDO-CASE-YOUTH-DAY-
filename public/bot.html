<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Case Desk</title>
<link rel="icon" href="/yp-mark.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Zilla+Slab:wght@600;700&display=swap">
<style>
/* Layout: one-screen phone chat in the Youth Day case-file stationery — dossier header, transcript with evidence papers inline, fixed question bar. One committed dark theme, matching the case desk console. */
:root{
  padding-top:env(safe-area-inset-top,0px);
  --ink:#1b1130; --ink-2:#241747; --ink-3:#2d1e55; --line:#3d2c62;
  --cream:#f2eff7; --muted:#a194c0; --orange:#e8913a; --teal:#6cb3a6; --rose:#dd7a63;
  --slab:"Zilla Slab", Georgia, serif;
  --sans:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--cream);font-family:var(--sans);font-size:15px;line-height:1.5;display:flex;flex-direction:column}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:620px;margin:0 auto;width:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

header.top{flex:none;background:var(--ink-2);border-bottom:2px solid var(--teal)}
header.top .wrap{padding-block:10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--slab);font-weight:700;font-size:23px;line-height:1.1;margin:0;text-wrap:balance}
.stamp-c{grid-column:2;grid-row:1/span 2;font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.14em;color:var(--orange);border:2px solid var(--orange);padding:3px 7px;transform:rotate(-5deg)}
.tray{grid-column:1/-1;display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.chip{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);background:transparent;color:var(--muted);padding:2px 7px;border-radius:3px}
.chip.got{border-color:var(--teal);color:var(--cream);background:rgba(108,179,166,.16)}
.chip.open{border-color:var(--orange);color:var(--cream);background:rgba(232,145,58,.14)}

main{flex:1;overflow-y:auto;min-height:0}
main .wrap{padding-block:14px 18px;display:flex;flex-direction:column;gap:12px}
.brief{border:1px dashed var(--line);padding:12px 14px;font-size:14px;color:var(--muted)}
.brief b{color:var(--cream)}
.brief .logo{display:block;height:30px;width:auto;margin-bottom:10px;background:#fff;padding:4px 8px;border-radius:3px}
.bub{max-width:86%;padding:9px 12px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.bub.me{align-self:flex-end;background:var(--orange);color:#22130a;border-bottom-right-radius:3px}
.bub.desk{align-self:flex-start;background:var(--ink-3);border-bottom-left-radius:3px}
.who{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin-bottom:2px}
.ev{align-self:stretch;border:1px solid var(--line);border-radius:4px;background:var(--ink-2);overflow:hidden}
.ev>button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;padding:10px 12px}
.ev>button:focus-visible{outline:2px solid var(--orange);outline-offset:-2px}
.ev .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;background:var(--teal);color:#0f1a18;padding:2px 6px;border-radius:2px}
.ev.op .tag{background:var(--orange);color:#22130a}
.ev.st .tag{background:var(--rose);color:#25100b}
.ev .ttl{min-width:0}
.ev .ttl b{display:block;font-family:var(--slab);font-size:16px;line-height:1.2}
.ev .ttl small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted)}
.ev .chev{font-family:var(--mono);color:var(--muted);font-size:13px}
.ev .doc{padding:0 10px 12px;overflow-x:auto}
.statement{background:#fbfaf7;color:#1b1b1a;border-radius:2px;padding:14px 16px;font-size:14px;line-height:1.55}
.statement .k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#7a6f63;display:block;margin-bottom:4px}
.statement p{margin:0;white-space:pre-wrap}

footer{flex:none;background:var(--ink-2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
footer .wrap{padding-block:10px;display:flex;flex-direction:column;gap:8px}
.sugg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.sugg button{flex:none;font-size:12px;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:14px;padding:4px 10px}
form{display:flex;gap:8px}
textarea{flex:1;min-width:0;resize:none;font:15px var(--sans);background:var(--ink);color:var(--cream);border:1px solid var(--line);border-radius:8px;padding:9px 10px;height:42px}
.send{font-weight:600;font-size:14px;background:var(--teal);color:#0f1a18;border:0;border-radius:8px;padding:0 16px}
.send:disabled{opacity:.5}
.mode{font-family:var(--mono);font-size:11px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.ev.new{animation:drop .35s ease-out}@keyframes drop{from{transform:translateY(-6px);opacity:.3}to{transform:none;opacity:1}}}

/* Evidence paper styles, taken from the case desk console */
.paper { background: #fbfaf7; color: #1b1b1a; border-radius: 2px; overflow: hidden; font-family: var(--sans); font-size: 13.5px; line-height: 1.5; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
.paper.serif .p-in { font-family: Georgia, "Times New Roman", serif; }
.p-bar { background: var(--bar, #333); color: #fff; display: flex; justify-content: space-between; gap: 10px; padding: 9px 14px; font-family: var(--mono); font-size: 9.5px; letter-spacing: 1.4px; text-transform: uppercase; }
.p-in { padding: 16px 18px; }
.p-h1 { font-family: var(--slab); font-weight: 700; font-size: 19px; margin: 0 0 3px; color: #1b1b1a; }
.p-sub { font-size: 12.5px; color: #5a5a55; }
.p-k { display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: 1.4px; text-transform: uppercase; color: #6a6a63; margin-bottom: 4px; }
.p-grid { display: flex; flex-wrap: wrap; gap: 14px 26px; margin-top: 14px; }
.p-grid > div { min-width: 140px; }
.p-grid b { display: block; font-size: 14.5px; }
.p-grid em { font-style: normal; font-size: 12.5px; color: #5a5a55; }
.p-quote { background: #f1ede4; border-left: 4px solid var(--bar, #333); padding: 11px 13px; margin-top: 14px; }
.p-quote p { margin: 0; font-style: italic; font-size: 14.5px; }
.p-note { margin: 12px 0 0; }
.p-fine { margin: 9px 0 0; font-size: 11px; color: #6a6a63; }
.p-tbl { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
.p-tbl th { text-align: left; padding: 6px 8px; font-family: var(--mono); font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase; color: #6a6a63; border-bottom: 1.5px solid #1b1b1a; }
.p-tbl td { padding: 7px 8px; border-bottom: 1px solid #e3e0d9; }
.p-tbl tr.p-hi td { background: #eef2f5; }
.p-box { border: 1px solid #c9d8e2; background: #f4f8fb; border-radius: 2px; padding: 11px 13px; margin-top: 12px; }
.p-boxh { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.p-pill { background: #1d6b3f; color: #fff; font-family: var(--mono); font-size: 9.5px; letter-spacing: .8px; padding: 2px 7px; border-radius: 2px; }
.p-box p { margin: 6px 0 0; }
.p-div { border-top: 1px dashed #c9c7c1; padding-top: 6px; }
.p-foot { display: flex; justify-content: space-between; gap: 10px; padding: 10px 18px; border-top: 1px solid #e3e0d9; font-size: 11.5px; color: #5a5a55; background: #f5f3ee; }
.p-closehead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; border-bottom: 2px solid #1b1b1a; padding-bottom: 10px; }
.p-stamp { border: 2px solid #1d6b3f; color: #1d6b3f; font-family: var(--mono); font-size: 13px; font-weight: 600; letter-spacing: 2px; padding: 4px 10px; transform: rotate(-4deg); white-space: nowrap; }
.p-check { list-style: none; margin: 14px 0 0; padding: 0; }
.p-check li { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
.p-check i { width: 18px; height: 18px; border: 1.5px solid #1b1b1a; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 12px; flex: 0 0 auto; }
.p-check span { flex: 1; }
.p-check em { font-style: normal; font-size: 12px; color: #5a5a55; }
.p-blank { border: 1px solid #c9c7c1; background: #fff; padding: 12px 14px; margin-top: 12px; }
.p-blank span { display: block; border-bottom: 1px solid #c9c7c1; height: 22px; margin-top: 12px; }
.p-mail + .p-mail { margin-top: 14px; border-top: 1px solid #e3e0d9; padding-top: 14px; }
.p-mailh { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.p-mailh b { font-size: 15px; }
.p-mailh span { font-size: 11.5px; color: #5a5a55; }
.p-mail p { margin: 8px 0 0; }
.p-slidebar { height: 8px; background: #0f3b57; }
.p-slide { font-family: var(--slab); font-weight: 700; font-size: 21px; line-height: 1.25; color: #0f3b57; margin: 0; }
.p-rule { width: 64px; height: 4px; background: #c0632f; margin: 12px 0 14px; }
.p-dash { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; font-size: 14.5px; }
.p-dash li { padding-left: 18px; position: relative; }
.p-dash li::before { content: "—"; position: absolute; left: 0; color: #c0632f; font-weight: 700; }
.p-person { border: 1px solid #d5d2cb; border-left: 5px solid var(--bar, #888); padding: 11px 13px; margin-top: 12px; }
.p-personh { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.p-personh b { display: block; font-size: 15px; }
.p-personh em { font-style: normal; font-size: 12.5px; color: #5a5a55; }
.p-personh .r { text-align: right; }
.p-person p { margin: 8px 0 0; }

.chat { max-width: 330px; margin: 12px auto 0; border: 1px solid #c9c7c1; border-radius: 12px; overflow: hidden; background: #ece5dd; }
.chat-h { background: #0f5c50; color: #fff; padding: 10px 12px; display: flex; align-items: center; gap: 10px; }
.chat-h .av { width: 30px; height: 30px; border-radius: 50%; background: #d7cfc4; color: #0f3b57; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex: 0 0 auto; }
.chat-h b { display: block; font-size: 14px; }
.chat-h em { font-style: normal; font-size: 10.5px; opacity: .85; }
.chat-b { padding: 10px 9px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #111; }
.chat-b .day { align-self: center; background: #d6d0c6; color: #3a3a37; font-size: 10.5px; padding: 2px 9px; border-radius: 7px; }
.msg { max-width: 82%; padding: 6px 9px 4px; }
.msg i { display: block; text-align: right; font-style: normal; font-size: 9.5px; color: #6b7a6b; margin-top: 2px; }
.msg.out { align-self: flex-end; background: #d9fdd3; border-radius: 8px 2px 8px 8px; }
.msg.in { align-self: flex-start; background: #fff; border-radius: 2px 8px 8px 8px; }

.paper.shukran { background: #fff; padding: 12px; }
.cert { border: 2px solid #26241f; padding: 5px; }
.cert-in { border: 5px solid #6fbf3b; background: radial-gradient(ellipse at 44% 40%, #fff 0%, #fffbe2 18%, #ffeb9c 44%, #ffdc55 70%, #f6c829 100%); padding: 14px 16px 10px; color: #26241f; }
.cert-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.shk { display: inline-flex; align-items: center; gap: 6px; background: #8cc63f; border: 2px solid #26241f; padding: 3px 7px; }
.shk b { font-family: Verdana, sans-serif; font-weight: 800; font-size: 15px; letter-spacing: .4px; }
.shk i { font-style: normal; background: #ffde17; border: 1.5px solid #26241f; width: 21px; height: 21px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.cert-cat { font-family: Georgia, serif; font-style: italic; font-size: 24px; text-align: right; }
.cert-stars { text-align: right; color: #f05a28; font-size: 19px; letter-spacing: 3px; margin-top: 3px; }
.cert-body { text-align: center; font-family: Georgia, serif; padding: 10px 6px; }
.cert-lead { font-style: italic; font-size: 13.5px; margin: 0; }
.cert-name { font-weight: 700; font-size: 19px; margin: 7px 0; }
.cert-cit { font-weight: 700; font-size: 14.5px; margin: 6px auto 0; max-width: 30em; }
.cert-foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; font-family: Georgia, serif; margin-top: 10px; }
.cert-foot em { font-style: normal; display: block; font-size: 10.5px; color: #5a4a12; }
.cert-sig { text-align: right; }
.cert-sig i { font-style: italic; font-size: 20px; color: #1a3f8f; display: block; }
.cert-sig b { font-size: 11.5px; display: block; }
.cert-fine { text-align: center; font-size: 8.5px; color: #6d5c1e; margin: 8px 0 0; }


</style>
<style>
[hidden]{display:none!important}
img{max-width:100%}
.reset{background:none;border:0;color:var(--muted);font-family:var(--mono);font-size:11px;text-decoration:underline;padding:0}
.confirm{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:11px;color:var(--cream)}
.confirm button{font-size:11px;border:1px solid var(--line);background:transparent;color:var(--cream);border-radius:4px;padding:2px 8px}
.confirm button.yes{border-color:var(--rose);color:var(--rose)}
.modeRow{display:flex;justify-content:space-between;gap:10px;align-items:center}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="eyebrow" id="eyebrow">Youth Day</div>
  <h1 id="title">Case desk</h1>
  <div class="stamp-c">CONFIDENTIAL</div>
  <div class="tray" id="tray" aria-label="Evidence on file"></div>
</div></header>

<main id="scroll"><div class="wrap" id="log">
  <div class="brief">
    <img class="logo" src="/logo-lockup.png" alt="For Oman · Petroleum Development Oman">
    <b>Your brief.</b> <span id="brief">Loading the case…</span>
  </div>
</div></main>

<footer><div class="wrap">
  <div class="sugg" id="sugg"></div>
  <form id="f">
    <label for="q" hidden>Your question</label>
    <textarea id="q" placeholder="Ask the case desk…" rows="1" maxlength="400"></textarea>
    <button class="send" id="send" type="submit">Ask</button>
  </form>
  <div class="modeRow">
    <div class="mode" id="mode">Your own private desk</div>
    <button type="button" class="reset" id="reset">Start over</button>
    <div class="confirm" id="confirm" hidden>Clear your chat? <button type="button" class="yes" id="yes">Clear</button><button type="button" id="no">Keep</button></div>
  </div>
</div></footer>

<script src="/docs.js"></script>
<script>
(function(){
  var m = location.pathname.match(/case\/?([0-9a-z]+)/i);
  var id = ((m && m[1]) || new URLSearchParams(location.search).get("case") || "1").replace(/[^0-9a-z]/gi,"").slice(0,4) || "1";
  var s = document.createElement("script");
  s.src = "/cases/case" + id + ".js";
  s.onload = function(){ start(id); };
  s.onerror = function(){ document.getElementById("brief").textContent = "This case is not on file. Check the QR code with the case desk."; };
  document.head.appendChild(s);
})();

function start(CASE_ID){
"use strict";
var C = window.CASE_BOT, DOCS = window.CASE_DOCS || {}, OPENING = window.CASE_OPENING || [];
var STATEMENTS = C.statements || {};
var RELEASABLE = C.docs.concat(Object.keys(STATEMENTS));
var KEY = "casedesk-" + CASE_ID;

var ITEMS = {}, LABEL = {};
OPENING.forEach(function(k,i){ ITEMS[k]={t:DOCS[k].title,s:DOCS[k].sub,kind:"op"}; LABEL[k]="Opening "+(i+1); });
C.docs.forEach(function(k){ ITEMS[k]={t:DOCS[k].title,s:DOCS[k].sub,kind:"doc"}; LABEL[k]="Card "+k.slice(3); });
Object.keys(STATEMENTS).forEach(function(k,i){ ITEMS[k]={t:STATEMENTS[k].t,s:STATEMENTS[k].s,kind:"st"}; LABEL[k]="Desk "+(i+1); });

var $ = function(id){return document.getElementById(id);};
var log=$("log"), tray=$("tray"), q=$("q"), send=$("send"), mode=$("mode"), scroll=$("scroll");
$("eyebrow").textContent=C.eyebrow; $("title").textContent=C.title; $("brief").textContent=C.brief;
document.title = C.title;

// This phone's own record: what it has been shown, and the chat so far
var S = { got: [], chat: [], history: [] };
try { var saved = JSON.parse(localStorage.getItem(KEY) || "null"); if (saved && Array.isArray(saved.chat)) S = saved; } catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
var got = {}; var busy = false;

function drawTray(){
  tray.textContent="";
  OPENING.concat(RELEASABLE).forEach(function(k){
    var b=document.createElement("button"); b.type="button";
    var isOp=ITEMS[k].kind==="op";
    b.className="chip"+(got[k]?(isOp?" open":" got"):"");
    b.textContent = isOp ? "O"+(OPENING.indexOf(k)+1) : (ITEMS[k].kind==="doc" ? k.slice(3) : "•");
    b.title = got[k] ? ITEMS[k].t : "Not released yet";
    b.setAttribute("aria-label", got[k] ? ITEMS[k].t : "Item not released yet");
    b.onclick=function(){ var c=$("ev-"+k); if(c) c.scrollIntoView({behavior:"smooth",block:"start"}); };
    tray.appendChild(b);
  });
}
function bubble(cls,text){
  var d=document.createElement("div"); d.className="bub "+cls;
  if(cls==="desk"){ var w=document.createElement("span"); w.className="who"; w.textContent="Case desk"; d.appendChild(w); }
  var t=document.createElement("span"); t.textContent=text; d.appendChild(t);
  log.appendChild(d); scroll.scrollTop=scroll.scrollHeight; return t;
}
function card(k){
  if(got[k] || !ITEMS[k]) return false;
  got[k]=true;
  var it=ITEMS[k];
  var box=document.createElement("article"); box.className="ev new "+it.kind; box.id="ev-"+k;
  var btn=document.createElement("button"); btn.type="button"; btn.setAttribute("aria-expanded","false");
  btn.innerHTML='<span class="tag"></span><span class="ttl"><b></b><small></small></span><span class="chev">Read</span>';
  btn.querySelector(".tag").textContent=LABEL[k];
  btn.querySelector("b").textContent=it.t;
  btn.querySelector("small").textContent=it.s;
  var doc=document.createElement("div"); doc.className="doc"; doc.hidden=true;
  if(DOCS[k]) doc.innerHTML=DOCS[k].html;
  else { var st=document.createElement("div"); st.className="statement"; var kk=document.createElement("span"); kk.className="k"; kk.textContent=STATEMENTS[k].s; var p=document.createElement("p"); p.textContent=STATEMENTS[k].b; st.appendChild(kk); st.appendChild(p); doc.appendChild(st); }
  var chev=btn.querySelector(".chev");
  btn.onclick=function(){ doc.hidden=!doc.hidden; btn.setAttribute("aria-expanded",doc.hidden?"false":"true"); chev.textContent=doc.hidden?"Read":"Hide"; };
  box.appendChild(btn); box.appendChild(doc); log.appendChild(box);
  drawTray(); scroll.scrollTop=scroll.scrollHeight;
  return true;
}

// Replay this phone's chat in order
function render(){
  Array.prototype.slice.call(log.querySelectorAll(".bub,.ev")).forEach(function(n){ n.remove(); });
  got={};
  OPENING.forEach(card);
  bubble("desk", C.welcome);
  S.chat.forEach(function(m){ if(m.k==="me") bubble("me",m.text); else if(m.k==="desk") bubble("desk",m.text); else if(m.k==="card") card(m.id); });
  drawTray();
}

function local(text){
  var s=text.toLowerCase();
  if(/answer|root cause|solution|real problem|blame|whose fault|villain/.test(s)) return {reply:"The Director will close the case. Test your theory against what you hold.",release:[]};
  var hits=RELEASABLE.filter(function(k){ return !got[k] && (C.keywords[k]||[]).some(function(w){return s.indexOf(w)>=0;}); }).slice(0,2);
  return hits.length ? {reply:"Here is what the file holds on that.",release:hits} : {reply:"The file has nothing new on that. Try asking about the plan, the committee, ratings, recognition, or the people involved.",release:[]};
}

function ask(text){
  text=text.trim(); if(busy || !text) return;
  busy=true; send.disabled=true; q.value="";
  bubble("me",text); S.chat.push({k:"me",text:text});
  var out=bubble("desk","Checking the file…");
  var released=RELEASABLE.filter(function(k){return got[k];});
  fetch("/api/desk",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({case:CASE_ID,question:text,released:released,history:S.history.slice(-6)})})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(r){ mode.textContent="Your own private desk"; return r; })
    .catch(function(){ mode.textContent="Desk offline · simple matching"; return local(text); })
    .then(function(r){
      out.textContent=r.reply;
      S.chat.push({k:"desk",text:r.reply});
      S.history.push({role:"user",content:text},{role:"assistant",content:JSON.stringify({reply:r.reply,release:r.release||[]})});
      S.history=S.history.slice(-8);
      (Array.isArray(r.release)?r.release:[]).slice(0,2).forEach(function(k){ k=String(k); if(RELEASABLE.indexOf(k)>=0 && card(k)) S.chat.push({k:"card",id:k}); });
      save(); busy=false; send.disabled=false;
    });
}

$("f").addEventListener("submit",function(e){e.preventDefault();ask(q.value);});
q.addEventListener("keydown",function(e){ if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask(q.value);} });
(C.suggestions||[]).forEach(function(s){ var b=document.createElement("button"); b.type="button"; b.textContent=s; b.onclick=function(){ask(s);}; $("sugg").appendChild(b); });
$("reset").onclick=function(){ $("reset").hidden=true; $("confirm").hidden=false; };
$("no").onclick=function(){ $("reset").hidden=false; $("confirm").hidden=true; };
$("yes").onclick=function(){ S={got:[],chat:[],history:[]}; save(); render(); $("reset").hidden=false; $("confirm").hidden=true; scroll.scrollTop=0; };
render();
if(S.chat.length===0) scroll.scrollTop=0;
}
