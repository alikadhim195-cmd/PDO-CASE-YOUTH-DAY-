<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Case Desk QR Codes</title>
<link rel="icon" href="/yp-mark.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Zilla+Slab:wght@700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--ink:#1b1130;--cream:#f2eff7;--orange:#e8913a;--teal:#6cb3a6}
body{margin:0;background:var(--ink);color:var(--cream);font-family:"IBM Plex Mono",monospace;padding:24px max(16px,env(safe-area-inset-left,0px))}
h1{font-family:"Zilla Slab",Georgia,serif;margin:0 0 4px}
p{margin:0 0 20px;color:#a194c0;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.qr{background:#fff;color:#1b1130;border-radius:6px;padding:18px;text-align:center}
.qr h2{font-family:"Zilla Slab",Georgia,serif;margin:0 0 2px;font-size:22px}
.qr small{display:block;margin-bottom:12px;color:#5a4d7a}
.qr .code{display:flex;justify-content:center}
.qr .url{margin-top:10px;font-size:11px;word-break:break-all}
</style>
</head><body>
<h1>Case desk QR codes</h1>
<p>One code per case. Print it, or show it on screen in the room. Each phone that scans it gets its own private chat.</p>
<div class="grid" id="grid"></div>
<script>
var CASES=[{id:"1",name:"Case 1",sub:"The credit · Hawrah North"}];
CASES.forEach(function(c){
  var url=location.origin+"/case/"+c.id;
  var d=document.createElement("div"); d.className="qr";
  d.innerHTML='<h2></h2><small></small><div class="code"></div><div class="url"></div>';
  d.querySelector("h2").textContent=c.name; d.querySelector("small").textContent=c.sub; d.querySelector(".url").textContent=url;
  document.getElementById("grid").appendChild(d);
  new QRCode(d.querySelector(".code"),{text:url,width:200,height:200,colorDark:"#1b1130",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});
});
</script>
</body></html>
